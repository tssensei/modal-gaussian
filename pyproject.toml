[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modal-gaussians"
version = "0.1.0"
description = "Standalone asynchronous multi-view modal Gaussian analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
]

[project.scripts]
modal-gaussians = "modal_gaussians.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
